<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<head>
    <style>
        #grad1{height: 400px;width: 400px; background-color: aqua;background-image: linear-gradient(to left bottom,lightskyblue ,hotpink ,lightgreen);}

        #grad2{height: 400px;width: 400px; background-color: aqua;background-image: repeating-radial-gradient(violet ,indigo ,blue,green,yellow,orange,red);}
        #grad3{height: 400px;width: 400px; background-color: aqua;background-image: conic-gradient(red 54deg,yellow 120deg,green 180deg);}
        
    </style>
</head>
<body>
    <div id="grad1"> Gradiant</div>
    <div id="grad2"></div>
    <div id="grad3"></div>
</body>
</html>
