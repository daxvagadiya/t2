<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<head>
    <style>
        div{width: 100px;height: 100px; background-color: yellow;
            transition-duration: 5s;
            transition-delay: 1s;
            transition-timing-function:ease-in;
            border: 2px dotted green;
            padding: 25px;
            margin-left: 100px;
            margin-top: 100px;
        }
        div:hover{
            width: 100px;height: 100px;border-radius: 100px; background-color: lightskyblue;
            border: 3px double hotpink;
        }
    </style>
</head>
<body>
    <div></div>
</body>
</html>
