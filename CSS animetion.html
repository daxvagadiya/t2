<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<head>
    <style>
        div{
            width: 400px;height: 400px;background-color: purple;border: 5px dashed black; animation: example;
            animation-duration: 5s;
            animation-iteration-count: infinite;
            animation-timing-function: ease-in-out;
            animation-delay: 1S;
            animation-direction: alternate;
            position: relative;
           
        }
        
            
        
        @keyframes example{
            /* animation name is case sencitive */
            0%{ background-color: red; left: 0px; top: 0px; border-radius: 0%;rotate: 0deg;}
            25%{background-color: yellow; left: 200px; top: 0px;border-radius: 10%;rotate: 90deg;}
            50%{background-color: blue;left: 200px; top: 200px;border-radius: 25%;rotate: 180deg;}
            75%{background-color: pink;left: 0px; top: 200px;border-radius: 35%;rotate: 270deg;}
            100%{background-color: green;left: 0px; top: 0px;border-radius: 50%;rotate: 360deg;}

        }
    </style>
</head>
<body>
    <div></div>
</body>
</html>
