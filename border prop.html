<!DOCTYPE html>

<head>
    <style>
        /* #p id selector
        h1,p  group selector */
        p{ height: 200PX;
            width: 200px;
            border-style:solid dotted double dashed;
            border-width: 5px;
            border-color: rgb(70,18,182) hotpink red green;
            /*short hand*/
                border: 2px dotted hotpink;
            border-top:2px solid blue;
            border-left: 2px dotted green;
            border-right:2px double purple;
            border-bottom:2px dashed hotpink;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <p>This is css border<br>
        hello<br>
        This is css border<br>
        hello<br>

        This is css border<br>
        hello<br>
        This is css border<br>
        hello<br>
        This is css border<br>
        hello<br>
    </p>
</body>
