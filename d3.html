<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>



<head>
    <!-- Element Selctor -->
    <style>
        p{color: blue;}
    </style>
</head>



<head>
    <!-- ID selector -->
    <style>
        #para1{color: red;}
    </style>
</head>
<body>
    <p id="para1">para with ID Selector</p>
    <p>without ID selector</p>
</body>



<head>
    <!-- class selector -->
    <style>
        .center{color: red; text-align: center;}
        .large{font-size: 200%;}
    </style>
</head>
<body>
    <h1 class="center"> h1 using class selector</h1>
    <p class="center large">para using class sector</p>
</body>



</html>
