<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<head>
    <style>
       
        div{
            width: 100px; height: 100px; background-color: red; border: 3px solid blue;
            padding: 10px; margin-top: 200px; margin-left: 200px;

        }
        /* hover aerrow uper depend kere
        active click pachi change thay */
        div:hover{
            
             height: 100px;width: 100px;border-radius:200px; background-color: yellow;
             border-top: 3px solid green;
             border-left: 3px dotted hotpink;
             border-bottom: 3px dashed blue;
             border-right: 3px double black;
             transition-duration:5s ;
            
            transform: translate(200px)rotate(180deg);
        }
    </style>
</head>
<body>
   

    <div>
    </div>
