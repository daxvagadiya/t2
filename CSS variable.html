<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<head>
    <style>
        :root{
            --b:blue;
            --all: solid dashed dotted double;
            --p20: 30px;
        }
        p{
            --c:center;
            --b:yellow;
            border-style: var(--all);
            padding:var(--p20);
            background-color: var(--b);
        }
        h1{
            color: var(--b);
            text-align: var(--c);

        }
        
    </style>
</head>
<body>
    <h1>hellow</h1>                                                                   
    <p>good morning</p>
</body>
</html>
